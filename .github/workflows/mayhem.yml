name: Publicar WODs Mayhem en CrossHero

on:
  schedule:
    # Hora de Hermosillo (UTC-7): jueves a domingo 8 pm  = viernes a lunes 03:00 UTC
    - cron: "0 3 * * 5,6,0,1"
    # domingo 10 pm Hermosillo = lunes 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar o prueba (solo muestra)"
        default: "prueba"

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Hermosillo
      CROSSHERO_EMAIL: ${{ secrets.CROSSHERO_EMAIL }}
      CROSSHERO_PASSWORD: ${{ secrets.CROSSHERO_PASSWORD }}
      SUGARWOD_API_KEY: ${{ secrets.SUGARWOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar semana siguiente
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.modo }}" != "publicar" ]; then
            python3 publicar_mayhem.py
          else
            python3 publicar_mayhem.py --publicar
          fi
          cat reservas.log 2>/dev/null || true
